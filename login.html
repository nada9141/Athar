<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sign in | Athar</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/main.js"></script>
</head>
<body id="top">
<header class="site-header">
  <a class="brand" href="index.html">Athar</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About us</a>
    <a href="login.html" class="active">Sign in</a>
    <a href="signup.html">New account</a>
  </nav>
</header>
<main class="container">
  <div class="banner-wrap">
    <span class="badge">Volunteer today</span>
    <img src="https://plus.unsplash.com/premium_photo-1663076505854-f6575b64df0c?auto=format&fit=crop&w=1400&q=80" width="700" height="220" alt="Athar logo" usemap="#bannermap">
    <map name="bannermap">
      <area shape="rect" coords="0,0,700,220" href="about.html" alt="About us">
    </map>
  </div>
  <section class="form-box card">
    <h1>Sign in</h1>
    <form name="loginForm" onsubmit="return validateLogin()" onreset="resetMessage()">
      <p><label for="email">Email address</label><br>
      <input type="email" id="email" name="email" size="35" placeholder="name@example.com" autofocus onfocus="focusField(this)" onblur="blurField(this)"></p>
      <p><label for="password">Password</label><br>
      <input type="password" id="password" name="password" size="35" onfocus="focusField(this)" onblur="blurField(this)"></p>
      <p><input type="submit" class="btn" value="Sign in">
      <input type="reset" class="btn light" value="Reset"></p>
      <p>Don't have an account? <a href="signup.html">Create a new account</a></p>
    </form>
    <div id="result"></div>
  </section>
</main>
<footer class="site-footer">
  <p>&copy; 2026 Athar Platform - CPIS-358 course project | King Abdulaziz University</p>
  <p><a href="#top">Back to top</a></p>
</footer>
</body>
</html>
